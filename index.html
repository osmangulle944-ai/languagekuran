<body>

<button id="qb-open" class="qb-corner notranslate" translate="no" type="button" aria-haspopup="dialog">
  <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z" fill="currentColor"/></svg>
  <span class="qb-corner-label" data-i18n="q_btn">Kıble Bul</span>
</button>
<button id="mq-open" class="qb-corner mq-corner notranslate" translate="no" type="button" aria-haspopup="dialog">
  <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-2.2 1.6-3.6 3.4-3.6 5.4h7.2C15.6 6.4 14.2 4.6 12 3z" fill="currentColor"/><path d="M6.5 10h11v10.5h-3.7v-4.2a1.8 1.8 0 0 0-3.6 0v4.2H6.5z" fill="currentColor"/><path d="M3 8.5h1.8V20.5H3zM19.2 8.5H21V20.5h-1.8z" fill="currentColor"/><path d="M3.9 6.2l.9-1.7.9 1.7zM20.1 6.2l-.9-1.7-.9 1.7z" fill="currentColor"/></svg>
  <span class="qb-corner-label" data-i18n="m_btn">Cami Bul</span>
</button>

<!-- Sağ üst köşe: site araması + dil seçici -->
<div id="corner">
<button id="kf-open" class="kf-corner notranslate" translate="no" type="button" aria-haspopup="dialog" aria-label="Keşfet" data-i18n-aria="kf_title">
  <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  <span class="kf-corner-label" data-i18n="kf_title">Keşfet</span>
</button>
<div id="lang" class="notranslate" translate="no">
  <button id="lang-toggle" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
    <img id="lang-flag" src="" alt="" width="20" height="15">
    <span id="lang-code">TR</span>
    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
  <div id="lang-panel">
    <input id="lang-search" type="search" placeholder="Search language…" autocomplete="off" aria-label="Search language">
    <ul id="lang-list" role="listbox"></ul>
  </div>
</div>
</div>
<div id="gt-host" aria-hidden="true"></div>

<!-- Video: sayfa açılınca otomatik oynar -->
<section class="video-hero">
  <video id="intro" autoplay muted loop playsinline poster="assets/poster.jpg">
    <source src="assets/intro.mp4" type="video/mp4">
  </video>
  <div id="pv" class="pv notranslate" translate="no" role="group" hidden>
    <p class="pv-ezan" role="status" hidden><i aria-hidden="true"></i><span class="pv-ezan-t"></span></p>
    <div class="pv-band">
      <p class="pv-top"><span class="pv-place"></span><span class="pv-day"></span><time class="pv-clock"></time></p>
      <ol class="pv-times"></ol>
      <p class="pv-next"><span class="pv-next-n"></span><span class="pv-next-c"></span><span class="pv-dst" hidden></span></p>
    </div>
  </div>
  <!-- Keşfet: videonun üstünde ince uzun arama çubuğu; basınca aşağı doğru sohbet açılır -->
  <button id="kf-hero" class="kf-hero notranslate" translate="no" type="button" aria-haspopup="dialog">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <span id="kf-hero-ph" class="kf-hero-ph"></span>
    <span class="kf-hero-tag" data-i18n="kf_title">Keşfet</span>
  </button>
</section>
<script>
/* Sessiz, otomatik oynar */
(function () { var v = document.getElementById('intro'); v.muted = true; var p = v.play(); if (p && p.catch) p.catch(function () {}); })();
</script>

<!-- 1. sıra: ayet akışı — mezar taşının üstünde ayetler sırayla, 3 saniyede bir -->
<section id="ayet-akis" class="ayet-akis notranslate" translate="no">
  <div class="ak-stone">
    <img src="assets/mezar.png" alt="" width="450" height="408" decoding="async">
    <div class="ak-face">
      <div id="ak-text" class="ak-text">
        <p id="ak-ar" class="ak-ar" lang="ar" dir="rtl"></p>
        <p id="ak-meal" class="ak-meal" dir="auto"></p>
        <p id="ak-ref" class="ak-ref" dir="auto"></p>
      </div>
    </div>
  </div>
</section>

<!-- 2. sıra: Kur'an -->
<section id="kuran" class="kuran notranslate" translate="no">
  <div class="kuran-inner">
    <h2 class="kuran-title" data-i18n="title">KUR'AN</h2>
    <div class="kuran-tabs" role="tablist">
      <button role="tab" data-tab="sure" aria-selected="true" data-i18n="tab_sure">Sure</button>
      <button role="tab" data-tab="cuz" aria-selected="false" data-i18n="tab_cuz">Cüz</button>
      <button role="tab" data-tab="kelime" aria-selected="false" data-i18n="tab_kw">Anahtar Kelime</button>
    </div>
    <div class="kuran-tools">
      <button id="kuran-sort" type="button">
        <span data-i18n="sort">SIRALA:</span> <b id="kuran-sort-label">ARTAN</b>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 7.5L6 4l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="kuran-grid" class="kuran-grid"></div>
    <div id="kuran-kelime" class="kuran-kelime" hidden>
      <form id="kw-form" class="kw-form" role="search">
        <input id="kw-input" type="search" placeholder="Anahtar kelime yazın…" autocomplete="off" enterkeyhint="search" data-i18n-ph="kw_ph" data-i18n-aria="tab_kw">
        <button type="submit" data-i18n="search_btn">Ara</button>
      </form>
      <div id="kw-info" class="kw-info"></div>
      <div id="kw-results" class="kw-results"></div>
      <button id="kw-more" class="kw-more" type="button" hidden data-i18n="more">Daha fazla göster</button>
    </div>
  </div>
</section>

<!-- Boş bölümler: içerikler sonra eklenecek -->
<section class="block"></section>
<section class="block"></section>
<section class="block"></section>

<!-- Sure okuma ekranı (sesli + metin) -->
<div id="reader" class="reader notranslate" translate="no" hidden role="dialog" aria-modal="true" aria-labelledby="rd-name">
  <header class="rd-head">
    <button id="rd-close" class="rd-iconbtn" aria-label="Kapat" data-i18n-aria="close">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="rd-titles">
      <div id="rd-name" class="rd-name notranslate" translate="no"></div>
      <div id="rd-sub" class="rd-sub"></div>
    </div>
    <div id="rd-arabic" class="rd-arabic notranslate" translate="no" lang="ar" dir="rtl"></div>
  </header>
  <div class="rd-settings">
    <label><span data-i18n="reciter">Kâri</span><select id="rd-reciter" class="notranslate" translate="no"></select></label>
    <label><span data-i18n="meal">Meal</span><select id="rd-meal" class="notranslate" translate="no"></select></label>
  </div>
  <div id="rd-body" class="rd-body"></div>
  <div class="rd-player">
    <button id="rd-play" class="rd-play" aria-label="Oynat" data-i18n-aria="play">
      <svg class="i-play" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
      <svg class="i-pause" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>
    </button>
    <div class="rd-track">
      <div class="rd-now notranslate" translate="no"><span id="rd-verse">—</span><span id="rd-time">0:00 / 0:00</span></div>
      <input id="rd-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Konum">
    </div>
    <audio id="rd-audio" preload="none"></audio>
  </div>
</div>

<!-- Keşfet: Kur'an'a dayalı sohbet (yalnızca ayetle, kaynağıyla cevap) -->
<div id="kesfet" class="kf notranslate" translate="no" hidden>
  <div class="kf-backdrop" id="kf-backdrop"></div>
  <div class="kf-panel" id="kf-panel" role="dialog" aria-modal="true" aria-labelledby="kf-name">
    <form id="kf-form" class="kf-bar" autocomplete="off">
      <svg class="kf-bar-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <input id="kf-input" type="text" enterkeyhint="send" autocapitalize="sentences" spellcheck="false" data-i18n-ph="kf_greet" data-i18n-aria="kf_title">
      <button id="kf-send" class="kf-send" type="submit" aria-label="Gönder" data-i18n-aria="kf_send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="kf-close" class="kf-x" type="button" aria-label="Kapat" data-i18n-aria="close">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </form>
    <div class="kf-head"><span class="kf-mark" aria-hidden="true">۞</span><b id="kf-name" data-i18n="kf_title">Keşfet</b><span class="kf-note" data-i18n="kf_hint"></span></div>
    <div id="kf-log" class="kf-log" aria-live="polite"></div>
  </div>
</div>

<div id="qibla" class="qb notranslate" translate="no" hidden>
  <div class="qb-backdrop" id="qb-backdrop"></div>
  <div class="qb-phone" id="qb-phone" role="dialog" aria-modal="true" aria-labelledby="qb-title">
    <header class="qb-head">
      <button id="qb-back" class="qb-back" type="button" aria-label="Geri" data-i18n-aria="q_back">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 id="qb-title" class="qb-title" data-i18n="q_title">Kıble Pusulası</h2>
      <span class="qb-head-sp" aria-hidden="true"></span>
    </header>
    <div class="qb-body">
      <div class="qb-dial-wrap" id="qb-dial-wrap" dir="ltr">
        <svg class="qb-dial" viewBox="-160 -168 320 330" aria-hidden="true">
          <path class="qb-lubber" d="M0 -166 L-9 -150 L9 -150 Z"/>
          <g id="qb-rose">
            <circle class="qb-ring" r="146"/>
            <circle class="qb-ring-in" r="96"/>
            <g id="qb-ticks"></g>
            <path class="qb-north" d="M0 -146 L-8 -126 L8 -126 Z"/>
            <g id="qb-kaaba" class="qb-kaaba">
              <circle r="17" class="qb-kaaba-bg"/>
              <rect x="-9" y="-9" width="18" height="18" rx="1.5" class="qb-kaaba-box"/>
              <rect x="-9" y="-4.5" width="18" height="3" class="qb-kaaba-band"/>
            </g>
          </g>
          <g id="qb-needle" class="qb-needle">
            <path d="M0 -92 L13 -8 L0 -16 L-13 -8 Z" class="qb-needle-head"/>
            <path d="M0 -16 L13 -8 L0 52 L-13 -8 Z" class="qb-needle-tail"/>
          </g>
          <circle r="7" class="qb-hub"/>
        </svg>
      </div>
      <div class="qb-read">
        <div id="qb-deg" class="qb-deg">—</div>
        <div class="qb-lbl" data-i18n="q_angle">Kıble açısı (kuzeyden)</div>
      </div>
      <p id="qb-msg" class="qb-msg" role="status" aria-live="polite"></p>
      <div class="qb-actions">
        <button id="qb-start" class="qb-btn qb-btn-main" type="button" data-i18n="q_start" hidden>Pusulayı başlat</button>
        <button id="qb-retry" class="qb-btn" type="button" data-i18n="retry" hidden>Tekrar dene</button>
      </div>
      <form id="qb-city" class="qb-city" role="search" hidden>
        <input id="qb-city-in" type="search" autocomplete="off" enterkeyhint="search" data-i18n-ph="q_city_ph" data-i18n-aria="q_city_ph">
        <button type="submit" class="qb-btn qb-btn-main" data-i18n="search_btn">Ara</button>
        <div id="qb-city-res" class="qb-city-res"></div>
      </form>
      <dl class="qb-facts">
        <div><dt data-i18n="q_dist">Kâbe'ye uzaklık</dt><dd id="qb-km">—</dd></div>
        <div><dt data-i18n="q_decl">Manyetik sapma düzeltmesi</dt><dd id="qb-dec">—</dd></div>
        <div class="qb-fact-loc"><dt data-i18n="q_gps">Konumunuz</dt><dd><span id="qb-loc">—</span> <button id="qb-relocate" class="qb-link" type="button" data-i18n="q_relocate" hidden>Konumu yenile</button></dd></div>
      </dl>
      <p class="qb-tip" data-i18n="q_tip"></p>
    </div>
  </div>
</div>

<div id="mosque" class="mq notranslate" translate="no" hidden>
  <div class="qb-backdrop" id="mq-backdrop"></div>
  <div class="qb-phone" role="dialog" aria-modal="true" aria-labelledby="mq-title">
    <header class="qb-head">
      <button id="mq-back" class="qb-back" type="button" aria-label="Geri" data-i18n-aria="q_back">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 id="mq-title" class="qb-title" data-i18n="m_title">Cami Bul</h2>
      <span aria-hidden="true"></span>
    </header>
    <div class="mq-body">
      <div class="mq-country"><img id="mq-flag" alt="" width="22" height="16"><span id="mq-country"></span></div>
      <div class="mq-tools">
        <form id="mq-search" class="mq-search" role="search" autocomplete="off" hidden>
          <input id="mq-city-in" type="search" enterkeyhint="search" data-i18n-ph="m_city_ph" data-i18n-aria="m_city_ph">
          <div id="mq-sugg" class="mq-sugg" hidden></div>
        </form>
        <button id="mq-near" class="mq-near" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span data-i18n="m_near">Yakınımdakiler</span>
        </button>
      </div>
      <div id="mq-chips" class="mq-chips"></div>
      <div id="mq-map" class="mq-map" dir="ltr"></div>
      <p id="mq-status" class="mq-status" role="status" aria-live="polite"></p>
      <div class="mq-list-wrap">
        <ul id="mq-list" class="mq-list"></ul>
        <button id="mq-more" class="qb-btn mq-more" type="button" data-i18n="more" hidden>Daha fazla</button>
        <p class="mq-src">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a> · <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a></p>
      </div>
    </div>
  </div>
</div>

<script src="lang.js?v=3"></script>
<script src="kuran.js?v=6"></script>
<script src="qibla.js?v=3"></script>
<script src="mosque.js?v=2"></script>
